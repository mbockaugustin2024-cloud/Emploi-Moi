name: Scan quotidien des offres

on:
  schedule:
    # 05:30 UTC ≈ tôt le matin en Afrique de l'Ouest/Centrale (ajustez selon votre fuseau)
    - cron: "30 5 * * *"
  workflow_dispatch: {}  # permet de lancer le scan manuellement depuis l'onglet Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer le scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scan_offres.py
